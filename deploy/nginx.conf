# CDN origin. The edge terminates TLS and connects here over HTTP.
# CDN addresses change, so they cannot be listed: the X-Real-IP the edge
# overwrites is taken as the client.
set_real_ip_from 0.0.0.0/0;
set_real_ip_from ::/0;
real_ip_header X-Real-IP;

# The apps trust this value (TRUSTED_PROXIES in compose.yaml).
proxy_set_header Host $host;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_http_version 1.1;
proxy_set_header Connection "";
# Channel tests take up to 90s; the apps give up writing at 120s.
proxy_read_timeout 125s;
# The apps cap JSON bodies at 1 MiB and answer the error themselves.
client_max_body_size 2m;

gzip on;
gzip_proxied any;
gzip_min_length 1024;
gzip_types text/css text/javascript application/json image/svg+xml;

# Re-resolve on every request: a recreated app gets a new address.
resolver 127.0.0.11 valid=10s;

server {
    listen 8080;
    server_name portal.example.com;
    set $app http://portal:8081;
    location / {
        proxy_pass $app;
    }
}

server {
    listen 8080;
    server_name admin.example.com;
    set $app http://admin:8082;
    location / {
        proxy_pass $app;
    }
}

server {
    listen 8080 default_server;
    server_name _;
    return 444;
}
